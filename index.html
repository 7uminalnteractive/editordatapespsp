<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor PES PSP</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 900px; margin: 0 auto; padding: 16px; }
  select { font-size: 1rem; padding: 8px; width: 100%; margin: 8px 0 16px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8884; white-space: nowrap; }
  #msg { opacity: .7; }
</style>
</head>
<body>
<h1>Editor PES PSP</h1>
<label for="team">Time</label>
<select id="team"><option value="">Carregando…</option></select>
<p id="msg"></p>
<div class="wrap"><table id="tbl" hidden>
  <thead><tr><th>Nº</th><th>Nome</th><th>Pos.</th><th>Idade</th><th>Nac.</th><th>Altura</th></tr></thead>
  <tbody></tbody>
</table></div>
<script>
const sel = document.getElementById('team'), msg = document.getElementById('msg'),
      tbl = document.getElementById('tbl'), body = tbl.querySelector('tbody');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data/teams.json').then(r => r.json()).then(teams => {
  sel.innerHTML = '<option value="">Escolha um time</option>' +
    teams.map(t => `<option value="${t.tm_id}">${esc(t.name)}</option>`).join('');
}).catch(() => { sel.innerHTML = ''; msg.textContent = 'Não consegui carregar data/teams.json'; });
sel.addEventListener('change', async () => {
  body.innerHTML = ''; tbl.hidden = true; msg.textContent = '';
  if (!sel.value) return;
  try {
    const r = await fetch(`data/squads/${sel.value}.json`);
    if (!r.ok) throw 0;
    const d = await r.json();
    body.innerHTML = d.players.map(p => `<tr><td>${esc(p.number)}</td><td>${esc(p.name)}</td>
      <td>${esc(p.position)}</td><td>${esc(p.age)}</td><td>${esc((p.nationality||[]).join(', '))}</td>
      <td>${p.height_cm ? p.height_cm + ' cm' : ''}</td></tr>`).join('');
    tbl.hidden = false;
    msg.textContent = d.players.length + ' jogadores';
  } catch { msg.textContent = 'Elenco ainda não baixado. Rode o workflow "Atualizar elencos" no GitHub.'; }
});
</script>
</body>
</html>
