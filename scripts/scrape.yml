name: Atualizar elencos
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs do Transfermarkt separados por espaço (vazio = todos)"
        required: false
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/scrape.py ${{ github.event.inputs.ids }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/squads
          git diff --cached --quiet || (git commit -m "Atualiza elencos" && git push)
